[package]
name = "if-app"
description = "IF 桌面应用：Tauri 命令与事件、设置、密钥"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "if_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
if-agent.workspace = true
if-domain.workspace = true
if-judge.workspace = true
if-store.workspace = true
serde.workspace = true
serde_json.workspace = true
# 来源附件的内容哈希：判断「这次导入的内容和上次是不是同一份」。
sha2.workspace = true
# PNG 角色卡内嵌 JSON 的解码与 zTXt / iTXt 解压（两者都已在 Cargo.lock 中）。
base64 = "0.22"
flate2 = "1"
tauri = { version = "2", features = [] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
